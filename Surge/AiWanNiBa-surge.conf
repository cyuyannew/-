[General]
[General]
# > 测试超时（秒）
test-timeout = 10
# UDP 优先级
udp-priority = false
# > 国内 测试 URL
internet-test-url = http://www.bing.com
# > 代理测速 URL
proxy-test-url = http://www.gstatic.com/generate_204
# > 自定义 GeoIP 数据库
geoip-maxmind-url = https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb
# > IPv6 支持（默认关闭）
ipv6 = false
# > DNS 服务器
dns-server = 223.5.5.5, 114.114.114.114, 119.29.29.29, 162.159.195.1, system
# DoH 服务器
encrypted-dns-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query
# > 当遇到 REJECT 策略时返回错误页
show-error-page-for-reject = true
allow-wifi-access = false
# HTTP 服务端口
wifi-access-http-port = 6528
# SOCKS5 服务端口
wifi-access-socks5-port = 6582
# 允许个人热点访问
allow-hotspot-access = true
# > 增强版 Wi-Fi 助理
wifi-assist = true
# HTTP-API控制
http-api = example@127.0.0.1:5208
http-api-tls = false
http-api-web-dashboard = true
# > 远程控制器
use-default-policy-if-wifi-not-primary = false
all-hybrid = false
# All Hybrid 网络并发
exclude-simple-hostnames = true
# > 排除简单主机名
read-etc-hosts = true
# > 从 /etc/hosts 读取 DNS 记录
# > 日志级别
loglevel = notify
# > Always Real IP Hosts
always-real-ip = *.msftconnecttest.com, *.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.logon.battlenet.com.cn, *.logon.battle.net, stun.l.google.com
# > Surge VIF
disable-geoip-db-auto-update = true
[Proxy Group]
PROXY = select, DIRECT, REJECT, 🇭🇰香港, 🇨🇳台湾, 🇯🇵日本, 🇸🇬新加坡, 🇺🇸美国, no-alert=0, hidden=0, include-all-proxies=0
# 台湾分流
Final = select, 🇭🇰香港, 🇨🇳台湾, 🇯🇵日本, 🇺🇸美国, 🇸🇬新加坡, no-alert=0, hidden=0, include-all-proxies=0
# 日本分流
🇭🇰香港 = select, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(?=.*(🇭🇰|港|HK|(?i)Hong))^((?!(3倍)).)*$, include-other-group=🟡延迟优选
# 新加坡分流
🇨🇳台湾 = select, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(🇨🇳)|(台)|(Tai)|(TW), include-other-group=🟡延迟优选
# 美国分流
🇯🇵日本 = select, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(🇯🇵)|(日)|(Japan)|(JP), include-other-group=🟡延迟优选
# 韩国分流
🇸🇬新加坡 = select, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(🇸🇬)|(坡)|(Singapore)|(SG), include-other-group=🟡延迟优选
🇺🇸美国 = select, no-alert=0, hidden=0, include-all-proxies=0, update-interval=0, policy-regex-filter=(🇺🇸)|(美)|(States)|(US), include-other-group=🟡延迟优选
Disney+ = select, PROXY, 🇭🇰香港, 🇨🇳台湾, 🇯🇵日本, 🇸🇬新加坡, 🇺🇸美国, no-alert=0, hidden=0, include-all-proxies=0
Netflix = select, PROXY, 🇭🇰香港, 🇨🇳台湾, 🇯🇵日本, 🇸🇬新加坡, 🇺🇸美国, no-alert=0, hidden=0, include-all-proxies=0
YouTube = select, PROXY, 🇭🇰香港, 🇨🇳台湾, 🇯🇵日本, 🇸🇬新加坡, 🇺🇸美国, no-alert=0, hidden=0, include-all-proxies=0
HBO = select, PROXY, 🇭🇰香港, 🇨🇳台湾, 🇯🇵日本, 🇸🇬新加坡, 🇺🇸美国, no-alert=0, hidden=0, include-all-proxies=0
Bilibili = select, PROXY, 🇭🇰香港, 🇨🇳台湾, 🇯🇵日本, 🇸🇬新加坡, 🇺🇸美国, no-alert=0, hidden=0, include-all-proxies=0
Apple = select, PROXY, 🇭🇰香港, 🇨🇳台湾, 🇯🇵日本, 🇸🇬新加坡, 🇺🇸美国, no-alert=0, hidden=0, include-all-proxies=0

